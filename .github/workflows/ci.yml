name: Source and packaging checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build PyYAML
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q lowlight_underwater scripts
      - run: python -m build
      - run: python scripts/check_wheel.py dist/*.whl
